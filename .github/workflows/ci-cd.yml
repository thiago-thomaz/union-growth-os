name: CI/CD Pipeline & Automatic Production Deployment — UNION GROWTH OS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test-and-validate:
    name: Backend Tests, Frontend Build, Security Audit & Docker Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Build Frontend Static Export
        working-directory: frontend
        run: |
          npm run build

      - name: Dockerfile & Multi-stage Lint Verification
        run: |
          python -c "
          from pathlib import Path
          dockerfile = Path('Dockerfile')
          assert dockerfile.exists(), 'Dockerfile ausente na raiz do repositório'
          txt = dockerfile.read_text(encoding='utf-8')
          assert 'FROM python:3.12-slim' in txt, 'Imagem base Python 3.12 ausente'
          assert 'EXPOSE 8000' in txt, 'Porta 8000 não exposta no Dockerfile'
          print('DOCKERFILE VALIDATION PASSED: Multi-stage build devidamente configurado.')
          "

      - name: Run Backend Pytest Suite (Unit, Integration & Restore)
        run: |
          export PYTHONPATH="backend"
          pytest backend/tests/test_union_growth_os.py -v

      - name: Security Audit & Secret Leak Check
        run: |
          python -c "
          import sys
          from pathlib import Path
          suspicious = [
              'BEGIN RSA PRIVATE KEY',
              'BEGIN OPENSSH PRIVATE KEY',
              'password = \"UnionGrowth@2026\"',
              '2|6KYgMM7ZQaKiuOcuG4x9cun0jTi72VZ1ZHJi0rCM93ee09c0',
          ]
          violations = []
          for p in Path('.').rglob('*.py'):
              if '.venv' in str(p) or '__pycache__' in str(p):
                  continue
              txt = p.read_text(encoding='utf-8', errors='ignore')
              for s in suspicious:
                  if s in txt and 'test_' not in p.name:
                      violations.append(f'{p}: contains sensitive string')
          if violations:
              print('SECURITY VIOLATION DETECTED:', violations)
              sys.exit(1)
          print('SECURITY AUDIT PASSED: Nenhum segredo ou chave privada exposta no repositório.')
          "

  deploy-and-verify:
    name: Automatic Deploy to Coolify VPS & Production Health Checks
    runs-on: ubuntu-latest
    needs: test-and-validate
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Deploy Client Tools
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Trigger Coolify Deployment & Verify HTTPS Production
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          PRODUCTION_BASE_URL: ${{ secrets.PRODUCTION_BASE_URL || 'https://automacao.projetosunion.cloud' }}
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL || 'http://72.62.13.62:8000' }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID || 'swpy83sa5wshb558fadlrzwc' }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python scripts/ci_deploy_and_verify.py \
            --target-url "$PRODUCTION_BASE_URL" \
            --expected-commit "$GITHUB_SHA"
