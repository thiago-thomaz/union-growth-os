name: CI/CD Pipeline — UNION GROWTH OS

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-and-validate:
    name: Backend Tests, Frontend Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          npm ci || npm install

      - name: Build Frontend Static Export
        working-directory: frontend
        run: |
          npm run build

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests/test_union_growth_os.py -v

      - name: Security Audit & Secret Leak Check
        run: |
          python -c "
          import sys
          from pathlib import Path
          suspicious = ['BEGIN RSA PRIVATE KEY', 'BEGIN OPENSSH PRIVATE KEY', 'password = \"UnionGrowth@2026\"']
          violations = []
          for p in Path('.').rglob('*.py'):
              if '.venv' in str(p) or '__pycache__' in str(p):
                  continue
              txt = p.read_text(encoding='utf-8', errors='ignore')
              for s in suspicious:
                  if s in txt and 'test_' not in p.name:
                      violations.append(f'{p}: contains {s}')
          if violations:
              print('SECURITY VIOLATION DETECTED:', violations)
              sys.exit(1)
          print('SECURITY AUDIT PASSED: No exposed sensitive keys found.')
          "

  deploy-coolify:
    name: Continuous Deployment Verification to Coolify VPS
    runs-on: ubuntu-latest
    needs: test-and-validate
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger Coolify Webhook Deployment
        run: |
          echo "Automated CI pipeline passed successfully."
          echo "Coolify auto-deploys from GitHub repository thiago-thomaz/union-growth-os."
          echo "Target server: 72.62.13.62 (Coolify Managed Host)."
          echo "Target application UUID: swpy83sa5wshb558fadlrzwc."
          echo "Target endpoint: https://uniongrowth.72.62.13.62.sslip.io."

